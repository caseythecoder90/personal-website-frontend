# Nginx config that runs INSIDE the frontend container.
# Not to be confused with the edge nginx in the backend repo, which
# terminates TLS and reverse-proxies hostnames to the right service.
#
# Responsibilities:
#   1. Serve the built Vite bundle from /usr/share/nginx/html.
#   2. Fall back to /index.html for unmatched paths so React Router
#      handles client-side routing on direct navigation / refresh.
#   3. Set sensible cache headers: long TTL on hashed assets, short TTL
#      on the HTML entry point.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip on text assets. Brotli would be better but isn't compiled into
    # the stock nginx:alpine image; gzip is good enough for a static SPA.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Hashed asset bundles emitted by Vite under /assets/ are immutable —
    # the filename changes whenever the content changes, so the browser
    # can cache them indefinitely.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files Vite copies from /public (favicons, manifest,
    # og-default.png). Names are stable — cache for a day, not forever.
    location ~* \.(?:ico|png|svg|webmanifest|txt)$ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: any path that doesn't match a real file gets
    # index.html, and React Router renders the right view client-side.
    # Without this, refreshing on /projects/some-slug returns 404.
    location / {
        try_files $uri $uri/ /index.html;

        # The HTML entry point must NOT be cached aggressively — users
        # need to receive new bundle hashes the next visit after a deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Quiet 404 for /favicon.ico when the real file is missing during dev.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
