name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Production API base URL — baked into the JS bundle at build time
  # because Vite inlines `import.meta.env.VITE_*` values during `vite build`.
  # This is a public URL, safe to keep in the workflow file.
  VITE_API_BASE_URL: https://api.caseyrquinn.com/api/v1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}

  # Rolls out to the Hetzner Kubernetes cluster (k8s-cluster-hetzner repo).
  # KUBE_CONFIG is a base64 kubeconfig for the least-privilege `ci-deployer`
  # ServiceAccount in the personal-website namespace — same secret value as the
  # backend repo uses, since both Deployments live in that namespace.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.13          # matches the cluster

      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out the new image
        run: |
          # short SHA matches docker/metadata-action's `type=sha,prefix=` tag
          TAG=${GITHUB_SHA::7}
          kubectl -n personal-website set image deploy/frontend \
            frontend=ghcr.io/caseythecoder90/personal-website-frontend:$TAG
          kubectl -n personal-website rollout status deploy/frontend --timeout=300s

      - name: Show pod state if the rollout failed
        if: failure()
        run: |
          kubectl -n personal-website get pods -l app=frontend
          kubectl -n personal-website logs -l app=frontend --tail=50 --all-containers || true
